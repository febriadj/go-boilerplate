# Install once per clone: make hooks
pre-commit:
  commands:
    fmt:
      glob: "*.go"
      run: bin/golangci-lint fmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.go"
      run: bin/golangci-lint run --new-from-rev=HEAD ./...

commit-msg:
  commands:
    commitlint:
      run: bin/commitlint lint --message {1}
