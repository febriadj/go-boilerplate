# Production: docker compose -f compose.prod.yaml --env-file .env.production up -d
# Put a TLS reverse proxy in front of the API; it only listens on 127.0.0.1:8080.
# Required in .env.production: POSTGRES_PASSWORD, CORS_ALLOWED_ORIGINS. See .env.example for the rest.
services:
  api:
    image: medpath-server:${VERSION:-latest}
    build:
      context: .
      target: prod
      args:
        VERSION: ${VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS to the medpath-client origin}
      DATABASE_URL: postgres://medpath:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/medpath?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  # Remove this service when using a managed database; then point DATABASE_URL at it with sslmode=verify-full.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: medpath
    # No published port: only the api reaches the database, over the compose network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medpath -d medpath"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
