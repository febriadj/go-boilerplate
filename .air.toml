# Live reload for the dev container (docker compose up).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/medpath-server ./cmd/api"
entrypoint = ["./tmp/medpath-server"]
include_ext = ["go"]
exclude_dir = ["bin", "tmp", "docs", ".git", ".claude", ".vscode"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
